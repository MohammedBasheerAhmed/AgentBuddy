# Continuous integration (TRACKER.md R1). Runs on every push and pull request. No secrets are used and nothing is published:
# the jobs install the locked dependencies, test, check, build and audit.
name: CI

on:
  push:
  pull_request:
  # Run by hand from the Actions tab, optionally only some end-to-end scenarios (for example "b,d"), to look at one failure in minutes.
  workflow_dispatch:
    inputs:
      scenarios:
        description: "End-to-end scenarios to run, comma separated (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, compile check, build, traceability, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The Node version people use locally (nvm, fnm, volta read the same file).
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact versions from the lockfile)
        run: npm ci
      - name: Lint (eslint.config.mjs; the views' import rule is build rule 2)
        run: npm run lint
      - name: Unit tests
        run: node tests/run.js
      - name: Compile check (every entry, nothing written; a warning fails it)
        run: node scripts/check-compile.js
      - name: Build
        run: node build.js
      - name: Traceability (every control names a test file that exists)
        run: npm run traceability:check
      - name: Arabic (every text a person reads has an Arabic entry)
        run: npm run i18n
      - name: Audit of the shipped dependencies
        run: npm audit --omit=dev

  # The same source must test the same on Windows, where most of the team works (paths with backslashes, a checkout that git could give
  # CRLF line endings; .gitattributes keeps it LF). Unit tests and the compile check only: the build and the e2e run are on Linux.
  windows:
    name: Unit tests and compile check on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact versions from the lockfile)
        run: npm ci
      - name: Unit tests
        run: node tests/run.js
      - name: Compile check (every entry, nothing written; a warning fails it)
        run: node scripts/check-compile.js

  e2e:
    name: End-to-end (real Chrome, fake ServiceNow, fake AI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    # This job must pass: it ran green on this runner three times in a row at the commit that removed the allowance to fail (it is the
    # same suite as on Windows; docs: TRACKER.md R1).
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (puppeteer-core is a pinned devDependency)
        run: npm ci
      - name: Chrome version
        run: $CHROME_PATH --version
      - name: Build and run every scenario
        # `runner` is not available in a job's env, only in a step's.
        env:
          AB_E2E_TMP: ${{ runner.temp }}/agentbuddy-e2e
          SCENARIOS: ${{ inputs.scenarios }}
          E2E_TIMING: "1"
        run: node build.js && node e2e/run.js "$SCENARIOS"
      - name: Keep the screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/agentbuddy-e2e/**/*.png
          if-no-files-found: ignore

  # What is shipped is the minified build (npm run package -- --minify): the same scenarios run against it, built into its own folder
  # (E2E_DIST) so dist/ stays the readable build the job above tested.
  e2e-minified:
    name: End-to-end on the minified build (what is shipped)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (puppeteer-core is a pinned devDependency)
        run: npm ci
      - name: Chrome version
        run: $CHROME_PATH --version
      - name: Build minified and run every scenario
        env:
          AB_E2E_TMP: ${{ runner.temp }}/agentbuddy-e2e
          E2E_DIST: ${{ runner.temp }}/agentbuddy-minified
          SCENARIOS: ${{ inputs.scenarios }}
          E2E_TIMING: "1"
        run: node build.js --minify --out "$E2E_DIST" && node e2e/run.js "$SCENARIOS"
      - name: Keep the screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-minified
          path: ${{ runner.temp }}/agentbuddy-e2e/**/*.png
          if-no-files-found: ignore
