<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team, first screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Inter,sans-serif;color:#1a1f1d}
button{font:inherit;color:inherit;cursor:pointer}
.panel{width:400px;height:880px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e4e8e6}
.mark{width:32px;height:32px;border-radius:8px;background:#1d6b52;display:flex;align-items:center;justify-content:center}
.ib{width:36px;height:36px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#44504b}
.row{display:flex;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid #eef0ef;background:#fff;align-items:flex-start;width:100%;text-align:left;box-sizing:border-box}
.tile{width:32px;height:32px;border-radius:8px;background:#eef0ef;flex:none;display:flex;align-items:center;justify-content:center;position:relative;color:#44504b}
.dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.rt{font-size:14px;font-weight:600;line-height:1.3}
.rl{font-size:13px;color:#5b6561;margin-top:2px;line-height:1.35}
.num{font-size:12px;font-weight:600;background:#eef0ef;border-radius:10px;padding:2px 8px;color:#33403a;flex:none}
.chip{display:inline-block;font-size:12px;border-radius:12px;padding:2px 8px;margin-right:6px}
.tk{padding:10px 16px 10px 60px;border-bottom:1px solid #eef0ef;background:#f8faf9}
.pick{border:1px solid #d5dbd8;background:#fff;border-radius:16px;padding:4px 10px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.bar{display:flex;border-top:1px solid #e4e8e6;background:#fff;margin-top:auto}
.bar button{flex:1;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#5b6561}
.bar button.on{color:#1d6b52;font-weight:600}
</style>
</helmet>
<div class="panel">
  <div class="hd">
    <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10l2 2 4-4"/></svg></div>
    <div style="flex:1"><div style="font-size:15px;font-weight:600;line-height:1.2">Agent Buddy</div><div style="font-size:12px;color:#5b6561">dev364920</div></div>
    <button class="ib" aria-label="All tools"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    <button class="ib" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
  </div>

  <div style="padding:16px 16px 12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 style="margin:0;font-size:20px;font-weight:600">Team</h1>
      <button class="pick">My groups (2) <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div style="font-size:13px;color:#5b6561;margin-top:4px">38 open tickets. Five need a lead today. Read at 15:36.</div>
  </div>

  <div style="margin:0 16px 12px">
    <button style="width:100%;display:flex;align-items:center;gap:12px;border:1px solid #1d6b52;background:#1d6b52;color:#fff;border-radius:10px;padding:12px 14px;text-align:left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
      <span style="flex:1"><span style="display:block;font-size:14px;font-weight:600">Weekly report</span><span style="display:block;font-size:12px;opacity:.92;margin-top:1px">One click. Ready to send to your manager.</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div style="border-top:1px solid #e4e8e6">
    <button class="row" aria-expanded="true">
      <span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span class="dot" style="background:#c4262e"></span></span>
      <span style="flex:1"><div class="rt">Needs attention now</div><div class="rl">3 breached, 2 about to breach</div></span>
      <span class="num">5</span>
    </button>
    <div class="tk"><div class="rt" style="font-size:13px"><span style="font-family:Consolas,monospace">INC0010100</span> Printer offline in Finance</div><div style="margin-top:4px"><span class="chip" style="background:#fde8e8;color:#b3261e">Breached 28 d</span><span style="font-size:12px;color:#5b6561">Beth Anglin · P3</span></div></div>
    <div class="tk"><div class="rt" style="font-size:13px"><span style="font-family:Consolas,monospace">INC0020003</span> Shared mailbox is missing from Outlook</div><div style="margin-top:4px"><span class="chip" style="background:#fde8e8;color:#b3261e">Breached 5 h</span><span style="font-size:12px;color:#5b6561">Dave Loftus · P2</span></div></div>
    <button style="border:0;background:#f8faf9;width:100%;text-align:left;padding:10px 16px 10px 60px;font-size:13px;color:#1d6b52;font-weight:600;border-bottom:1px solid #eef0ef">Show the other 3</button>

    <button class="row">
      <span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="dot" style="background:#8a5a00"></span></span>
      <span style="flex:1"><div class="rt">Getting old</div><div class="rl">8 open for more than 7 days, oldest 31</div></span>
      <span class="num">8</span>
    </button>
    <button class="row">
      <span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 6"/></svg></span>
      <span style="flex:1"><div class="rt">Who is carrying the load</div><div class="rl">2 people hold 40% of the open tickets</div></span>
      <span class="num">2</span>
    </button>
    <button class="row">
      <span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 7 0 0 1 12-5l2 2M19 12a7 7 0 0 1-12 5l-2-2"/><path d="M19 4v5h-5M5 20v-5h5"/></svg></span>
      <span style="flex:1"><div class="rt">Coming back again</div><div class="rl">VPN Gateway EU: 4 tickets, one cause?</div></span>
      <span class="num">4</span>
    </button>
    <button class="row">
      <span class="tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg></span>
      <span style="flex:1"><div class="rt">How well tickets are closed</div><div class="rl">3 of 14 closed this week have no fix note</div></span>
      <span class="num">3</span>
    </button>
  </div>

  <div style="padding:8px 16px 0">
    <button style="display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 0;text-align:left;color:#1d6b52;font-size:14px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span style="flex:1">All team charts and tables</span></button>
  </div>

  <nav class="bar" aria-label="Screens">
    <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>My work</button>
    <button class="on" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 6"/></svg>Team</button>
    <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>Ticket</button>
    <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>Write</button>
    <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Knowledge</button>
  </nav>
</div>
</x-dc>

</html>
