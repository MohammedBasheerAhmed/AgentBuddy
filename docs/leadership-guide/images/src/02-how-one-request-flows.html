</style></head><body><div class="title">How one request flows</div><div class="sub">Nine steps, two outside destinations, nothing written back without the person pressing Save.</div>
    <svg width="1400" height="1010" viewBox="0 0 1400 1010" style="position:absolute;left:0;top:0;font-family:'Segoe UI',system-ui,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b52"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker></defs><rect x="305" y="165" width="790" height="470" rx="20" fill="#e6f2ed" stroke="#1d6b52" stroke-width="2.5"/><text x="330" y="196" font-size="18" font-weight="700" fill="#1d6b52">THE PERSON'S BROWSER: everything AgentBuddy does runs here</text><text x="170" y="196" font-size="16" font-weight="700" fill="#5b6561" text-anchor="middle">OUTSIDE · YOURS</text><text x="1230" y="196" font-size="16" font-weight="700" fill="#5b6561" text-anchor="middle">OUTSIDE · YOURS</text><rect x="65" y="215" width="210" height="150" rx="14" fill="#f4f6f5" stroke="#1a1f1d" stroke-width="2.5"/><text x="170" y="249" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Your ServiceNow</text><text x="170" y="275" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">instance</text><text x="170" y="303" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Tickets, knowledge,</text><text x="170" y="323.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">approvals. Your roles</text><text x="170" y="344.6" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">and ACLs apply</text><rect x="1125" y="215" width="210" height="150" rx="14" fill="#f4f6f5" stroke="#1a1f1d" stroke-width="2.5"/><text x="1230" y="249" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Your AI endpoint</text><text x="1230" y="277" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Azure OpenAI, company</text><text x="1230" y="297.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">gateway, Anthropic,</text><text x="1230" y="318.6" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Gemini, local model…</text><rect x="330" y="215" width="210" height="150" rx="14" fill="#ffffff" stroke="#c9d1cd" stroke-width="2"/><text x="435" y="249" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Page reader</text><text x="435" y="277" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Reads the open ticket,</text><text x="435" y="297.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">GET only, with the</text><text x="435" y="318.6" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">person's own session</text><rect x="595" y="215" width="210" height="150" rx="14" fill="#ffffff" stroke="#c9d1cd" stroke-width="2"/><text x="700" y="249" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Side panel</text><text x="700" y="277" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">The five screens, the</text><text x="700" y="297.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">preview and the answer</text><rect x="860" y="215" width="210" height="150" rx="14" fill="#ffffff" stroke="#1d6b52" stroke-width="3"/><text x="965" y="249" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">PII firewall</text><text x="965" y="277" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Masks names, emails and</text><text x="965" y="297.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">numbers. Seals the</text><text x="965" y="318.6" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">request. Shows the preview</text><rect x="65" y="470" width="210" height="130" rx="14" fill="#f4f6f5" stroke="#1a1f1d" stroke-width="2.5"/><text x="170" y="504" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">ServiceNow form</text><text x="170" y="532" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">The person presses Save</text><rect x="330" y="470" width="210" height="130" rx="14" fill="#ffffff" stroke="#c9d1cd" stroke-width="2"/><text x="435" y="504" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Page bridge</text><text x="435" y="532" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Fills ONE field.</text><text x="435" y="552.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Insert has an Undo</text><rect x="595" y="470" width="210" height="130" rx="14" fill="#ffffff" stroke="#c9d1cd" stroke-width="2"/><text x="700" y="504" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Answer</text><text x="700" y="532" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">The person reviews it</text><text x="700" y="552.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">before anything is inserted</text><rect x="860" y="470" width="210" height="130" rx="14" fill="#ffffff" stroke="#1d6b52" stroke-width="3"/><text x="965" y="504" font-size="20" fill="#1a1f1d" font-weight="700" text-anchor="middle">Restore on device</text><text x="965" y="532" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">Real names and values</text><text x="965" y="552.8" font-size="16" fill="#5b6561" font-weight="400" text-anchor="middle">put back, locally</text><path d="M279 290 L324 290" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><path d="M544 290 L589 290" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><path d="M809 290 L854 290" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><path d="M1074 290 L1119 290" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><circle cx="302.5" cy="262" r="16" fill="#1d6b52"/><text x="302.5" y="268" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="567.5" cy="262" r="16" fill="#1d6b52"/><text x="567.5" y="268" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="832.5" cy="262" r="16" fill="#1d6b52"/><text x="832.5" y="268" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="1097.5" cy="262" r="16" fill="#1d6b52"/><text x="1097.5" y="268" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="1052" cy="367" r="16" fill="#1d6b52"/><text x="1052" y="373" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M1230 369 L1230 535 L1076 535" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><circle cx="1230" cy="413" r="16" fill="#1d6b52"/><text x="1230" y="419" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M856 535 L811 535" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><circle cx="832.5" cy="507" r="16" fill="#1d6b52"/><text x="832.5" y="513" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M591 535 L546 535" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><circle cx="567.5" cy="507" r="16" fill="#1d6b52"/><text x="567.5" y="513" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">8</text><path d="M326 535 L281 535" fill="none" stroke="#1d6b52" stroke-width="3"  marker-end="url(#ah)"/><circle cx="302.5" cy="507" r="16" fill="#1d6b52"/><text x="302.5" y="513" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">9</text><circle cx="85" cy="690" r="16" fill="#1d6b52"/><text x="85" y="696" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="113" y="696" font-size="18" fill="#1a1f1d">Read the open ticket with the person's own session (GET only)</text><circle cx="85" cy="730" r="16" fill="#1d6b52"/><text x="85" y="736" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="113" y="736" font-size="18" fill="#1a1f1d">The panel gets the record and its thread</text><circle cx="85" cy="770" r="16" fill="#1d6b52"/><text x="85" y="776" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="113" y="776" font-size="18" fill="#1a1f1d">The text goes to the PII firewall</text><circle cx="85" cy="810" r="16" fill="#1d6b52"/><text x="85" y="816" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="113" y="816" font-size="18" fill="#1a1f1d">The person sees exactly what will be sent, and can mask more</text><circle cx="85" cy="850" r="16" fill="#1d6b52"/><text x="85" y="856" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="113" y="856" font-size="18" fill="#1a1f1d">Only the masked text goes to the AI endpoint</text><circle cx="760" cy="690" r="16" fill="#1d6b52"/><text x="760" y="696" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="788" y="696" font-size="18" fill="#1a1f1d">The answer comes back with placeholders</text><circle cx="760" cy="730" r="16" fill="#1d6b52"/><text x="760" y="736" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="788" y="736" font-size="18" fill="#1a1f1d">Real values are restored on the device</text><circle cx="760" cy="770" r="16" fill="#1d6b52"/><text x="760" y="776" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="788" y="776" font-size="18" fill="#1a1f1d">The person reviews the answer and presses Insert</text><circle cx="760" cy="810" r="16" fill="#1d6b52"/><text x="760" y="816" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="788" y="816" font-size="18" fill="#1a1f1d">One field is filled; the person presses Save</text><rect x="60" y="925" width="1280" height="52" rx="12" fill="#1a1f1d"/><text x="700" y="958" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">Two destinations only. No AgentBuddy server · no account · no analytics · nothing installed in ServiceNow</text></svg></body></html>
